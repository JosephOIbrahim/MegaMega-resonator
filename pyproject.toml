[project]
name = "megamega"
version = "0.1.0"
description = "Track A — USD LIVRPS as text-space composition substrate for cloud LLM signal multiplication."
requires-python = ">=3.12"
authors = [{ name = "Joe Ibrahim" }]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Reserved for downstream phases — not installed by default to keep Phase 1 lean.
usd = ["usd-core>=24.0"]
cloud = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["megamega"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:megamega.*",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]
